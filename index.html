        const gematriaValues = {
            'a': 6, 'b': 5, 'c': 300, 'k': 300, 'd': 4, 'e': 5, 'f': 8, 'g': 3,
            'h': 5, 'i': 60, 'y': 60, 'j': 60, 'l': 30, 'm': 40, 'n': 50, 'o': 70,
            'p': 8, 'q': 100, 'r': 200, 's': 9, 't': 9, 'u': 70, 'v': 70, 'w': 70,
            'x': 400, 'z': 7
        };

        function calculateGematria(str) {
            let total = 0;
            const s = str.toLowerCase();
            for (let i = 0; i < s.length; i++) {
                total += gematriaValues[s[i]] || 0;
            }
            return total;
        }

        const ELEMENT_NAMES = { air: 'Air', water: 'Water', earth: 'Earth', fire: 'Fire' };
        const QUAD_DIRECTIONS = { tl: 'NW', tr: 'NE', bl: 'SW', br: 'SE' };

        class EnochianAudio {
            constructor() {
                this.ctx = null;
                this.enabled = false;
                this.drone = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') this.ctx.resume();
            }

            toggle() {
                this.enabled = !this.enabled;
                if (this.enabled) this.init();
                return this.enabled;
            }

            playClick() {
                if (!this.enabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.1);

                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            }

            playWhoosh() {
                if (!this.enabled || !this.ctx) return;
                const bufferSize = this.ctx.sampleRate * 1.5;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(50, this.ctx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(1200, this.ctx.currentTime + 0.5);
                filter.frequency.exponentialRampToValueAtTime(50, this.ctx.currentTime + 1.5);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.3, this.ctx.currentTime + 0.3);
                gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 1.5);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                noise.start();
            }
        }

        const audioEngine = new EnochianAudio();

        class EnochianSpeech {
            constructor() {
                this.supported = 'speechSynthesis' in window;
                this.speaking = false;
                this.voice = null;
                this.token = 0;
                if (this.supported) {
                    this.pickVoice();
                    window.speechSynthesis.addEventListener('voiceschanged', () => this.pickVoice());
                }
            }

            pickVoice() {
                const voices = window.speechSynthesis.getVoices();
                const gb = voices.filter(v => v.lang.replace('_', '-').toLowerCase() === 'en-gb');
                const preferred = /Daniel|UK English Male|Arthur|Oliver|Serena|Martha|UK English Female|Kate/i;
                this.voice = gb.find(v => preferred.test(v.name)) || gb[0] || null;
            }

            clean(text) {
                return text.replace(/\b[A-Z]{2,}\b/g, w => w[0] + w.slice(1).toLowerCase());
            }

            speak(text, onEnd) {
                if (!this.supported) return;
                this.stop();
                const myToken = ++this.token;
                const chunks = this.clean(text).match(/[^.!?]+[.!?]+["')]*|[^.!?]+$/g) || [text];
                this.speaking = true;
                chunks.forEach((chunk, i) => {
                    const u = new SpeechSynthesisUtterance(chunk.trim());
                    u.lang = 'en-GB';
                    if (this.voice) u.voice = this.voice;
                    u.rate = 0.9;
                    u.pitch = 0.95;
                    const finish = () => {
                        if (myToken !== this.token) return;
                        this.speaking = false;
                        if (onEnd) onEnd();
                    };
                    if (i === chunks.length - 1) { u.onend = finish; u.onerror = finish; }
                    window.speechSynthesis.speak(u);
                });
            }

            stop() {
                if (!this.supported) return;
                this.token++;
                this.speaking = false;
                window.speechSynthesis.cancel();
            }
        }

                if (fontBtn) fontBtn.addEventListener('click', () => this.toggleScript());

            toggleScript() {
                this.state.useEnochianFont = !this.state.useEnochianFont;

                this.renderContent(false);
            },

            loadData() {
                const data = window.EnochianData;
                const calls = window.ENOCHIAN_CALLS;

                if (!data) console.error('enochian-data.js failed to load.');
                if (!calls) console.error('enochian-calls.js failed to load.');

                enochianCalls = calls?.calls?.length
                    ? calls.calls
                    : [{ number: 1, name: "Data not loaded", enochian: "Check files.", translation: "Data not loaded." }];

                dictionaryDB = (data?.DICTIONARY || []).map(e => ({
                    word: e.word,
                    meaning: e.meaning,
                    v1: e.values[0],
                    source: e.source.code === 'CALL'
                        ? `Call ${e.source.call}.${e.source.position}`
                        : (e.source.code || '—')
                }));

                tablesData = window.EnochianTables || null;
                if (!tablesData) console.error('enochian-tables.js failed to load.');

                parsedTablets = (data?.TABLETS?.boards || []).map(b =>
                    b.grid.map((rowStr, r) =>
                        [...rowStr].map((l, c) => ({ n: r * 7 + c + 1, l }))
                    )
                );
            },

            setTab(tabId) {
                this.state.currentTab = tabId;
                audioEngine.playClick();
                this.renderNav();
                this.renderContent();
            },

            renderNav() {
                const nav = document.getElementById('main-nav');
                nav.innerHTML = this.tabs.map(tab => `
                <button onclick="App.setTab('${tab.id}')" class="tab-btn w-full text-left px-4 md:px-6 py-3 md:py-4 flex items-center gap-4 text-gray-400 hover:text-solarGold hover:bg-white/5 transition-all outline-none ${this.state.currentTab === tab.id ? 'active' : ''}">
                    <svg class="w-5 h-5 stroke-current fill-none flex-shrink-0" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="${tab.icon}"/></svg>
                    <span class="font-serif tracking-wider text-xs md:text-sm uppercase hidden md:block">${tab.label}</span>
                </button>
            `).join('');
            },

            renderContent(animate = true) {
                speech.stop();
                const container = document.getElementById('main-container');
                container.innerHTML = '';
                container.classList.add('animate-fade-in');

                if (leafletMap) {
                    leafletMap.remove();
                    leafletMap = null;
                }

                if (animate) {
                    container.style.animation = 'none';
                    container.offsetHeight; /* trigger reflow */
                    container.style.animation = null;
                } else {
                    container.style.animation = 'none';
                }

                switch (this.state.currentTab) {
                    case 'calls': container.innerHTML = this.viewCalls(); break;
                    case 'map':
                        container.innerHTML = this.viewMap();
                        setTimeout(() => this.initMap(), 100);
                        break;
                    case 'table': container.innerHTML = this.viewTable(); break;
                    case 'tablets': container.innerHTML = this.viewTablets(); break;
                    case 'lamen': container.innerHTML = this.viewLamen(); break;
                    case 'ensign': container.innerHTML = this.viewEnsign(); break;
                    case 'dict': container.innerHTML = this.viewDictionary(); break;
                    case 'about': container.innerHTML = this.viewAbout(); break;
                }
            },

            currentCall() {
                return enochianCalls.find(c => c.number === this.state.currentCallId) || enochianCalls[0];
            },

            toggleRecite() {
                if (speech.speaking) {
                    speech.stop();
                } else {
                    speech.speak(this.currentCall().translation, () => this.updateReciteButton());
                }
                this.updateReciteButton();
            },

            updateReciteButton() {
                const btn = document.getElementById('recite-btn');
                if (!btn) return;
                btn.innerHTML = speech.speaking ? this.reciteLabel(true) : this.reciteLabel(false);
            },

            reciteLabel(isSpeaking) {
                return isSpeaking
                    ? `<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg> Stop`
                    : `<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> Recite`;
            },

            viewCalls() {
                const call = this.currentCall();
                const wordCount = call.enochian_word_count || call.enochian.split(' ').length;

                return `
                <div class="max-w-4xl mx-auto">
                    <header class="flex justify-between items-end border-b border-solarGold/20 pb-4 mb-8">
                        <div>
                            <h2 class="text-3xl font-serif text-solarGold tracking-widest uppercase">The Enochian Calls</h2>
                            <p class="text-gray-400 text-sm mt-2 font-serif">Select an invocation to view its geometry and phonetic translation.</p>
                        </div>
                        <select id="call-selector" onchange="App.state.currentCallId = parseInt(this.value); App.renderContent();" class="bg-obsidian border border-solarGold/30 text-solarGold font-serif py-2 px-4 rounded outline-none focus:border-solarGold">
                            ${enochianCalls.map(c => `<option value="${c.number}" ${c.number === call.number ? 'selected' : ''}>${c.name}</option>`).join('')}
                        </select>
                    </header>

                    <div class="panel-bg border border-solarGold/10 rounded-xl p-8 relative overflow-hidden shadow-2xl mb-6">
                        <div class="absolute -right-20 -top-20 opacity-5 pointer-events-none">
                            <svg viewBox="0 0 200 200" class="w-96 h-96 stroke-solarGold fill-none"><circle cx="100" cy="100" r="90" stroke-width="2"/><circle cx="100" cy="100" r="80" stroke-dasharray="5,5"/><polygon points="100,10 186.6,145 13.4,145" stroke-width="1"/></svg>
                        </div>

                        <div class="mb-4 flex justify-between items-center z-10 relative">
                            <div class="flex flex-col">
                                <span class="text-xs text-aethyrSapphire tracking-widest uppercase">${wordCount} Words</span>
                                ${call.direction_or_angle ? `<span class="text-[10px] text-gray-500 uppercase tracking-widest mt-1">${call.direction_or_angle}</span>` : ''}
                            </div>
                            <button id="recite-btn" onclick="App.toggleRecite()" ${speech.supported ? '' : 'disabled title="Speech is not supported in this browser"'} class="flex items-center gap-2 text-solarGold hover:text-white border border-solarGold/30 hover:border-solarGold px-4 py-1.5 rounded-full transition-all text-xs font-serif tracking-widest uppercase disabled:opacity-40 disabled:cursor-not-allowed">
                                ${App.reciteLabel(false)}
                            </button>
                        </div>

                        <div class="bg-obsidian/50 rounded-lg p-6 mb-6 border border-white/5 min-h-[120px] text-center leading-relaxed flex flex-wrap justify-center items-center text-solarGold ${this.state.useEnochianFont ? 'font-enochian text-4xl tracking-normal' : 'font-serif text-xl tracking-[0.2em] uppercase'}">
                            ${this.state.useEnochianFont ? call.enochian.toLowerCase() : call.enochian}
                        </div>

                        <div class="grid md:grid-cols-2 gap-8 z-10 relative">
                            <div>
                                <h3 class="text-xs uppercase tracking-widest text-gray-500 mb-2 border-b border-gray-800 pb-1">Enochian / Phonetic</h3>
                                <p class="font-serif text-gray-300 leading-relaxed text-sm">${call.enochian}</p>
                            </div>
                            <div>
                                <h3 class="text-xs uppercase tracking-widest text-gray-500 mb-2 border-b border-gray-800 pb-1">English Translation</h3>
                                <p class="font-serif text-solarGold leading-relaxed text-sm opacity-90">${call.translation}</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            },

            // ---------- World Map Module ----------
            viewMap() {
                return `
                <div class="max-w-6xl mx-auto flex flex-col h-[calc(100vh-6rem)]">
                    <header class="border-b border-solarGold/20 pb-4 mb-6 flex-shrink-0">
                        <h2 class="text-3xl font-serif text-solarGold tracking-widest uppercase">The 91 Governors</h2>
                        <p class="text-gray-400 text-sm mt-2 font-serif">Locate nearest esoteric regions based on geographic proximity.</p>
                    </header>
                    <div class="grid md:grid-cols-12 gap-6 flex-1 min-h-0">
                        <!-- Sidebar for Location -->
                        <div class="md:col-span-4 panel-bg border border-solarGold/10 rounded-xl p-6 shadow-xl flex flex-col gap-5 h-full overflow-y-auto">
                            <!-- 1:1 Aspect Ratio Top Image -->
                            <div class="hidden md:block">
                                <img src="earth.jpeg" alt="Global Projection" class="w-full object-cover rounded-lg border border-solarGold/30" style="aspect-ratio: 1 / 1;" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
                                <div class="hidden flex-col items-center justify-center text-center p-6 gap-2 border border-solarGold/20 rounded-lg aspect-square bg-black/40">
                                    <span class="text-[10px] uppercase tracking-widest text-gray-500 font-serif">Image not found</span>
                                    <code class="text-xs text-solarGold">earth.jpeg</code>
                                </div>
                            </div>

                            <div class="relative">
                                <div class="text-[10px] uppercase tracking-widest text-aethyrSapphire font-serif mb-2">Initialize Scanner</div>
                                <input type="text" id="city-input" placeholder="Enter City (e.g., London, Tokyo)..." class="w-full bg-obsidian border border-white/10 rounded px-4 py-3 text-white text-sm focus:outline-none focus:border-solarGold transition-colors mb-3" autocomplete="off">
                                <div id="autocomplete-results" class="autocomplete-dropdown hidden"></div>
                                
                                <button onclick="App.findNearestEnochianFromInput()" class="w-full bg-solarGold/10 text-solarGold border border-solarGold/40 hover:bg-solarGold/20 py-2.5 rounded uppercase tracking-widest text-xs font-serif transition-colors mt-2">
                                    Analyze Location
                                </button>
                                <div id="map-loading" class="hidden text-center text-[10px] text-gray-400 font-serif uppercase tracking-widest mt-3 animate-pulse">Calculating Proximity...</div>
                            </div>
                            
                            <div id="map-results" class="mt-4 flex-1">
                                <!-- Results populate here -->
                            </div>
                        </div>

                        <!-- Map Display -->
                        <div class="md:col-span-8 panel-bg border border-solarGold/10 rounded-xl p-2 shadow-xl h-[400px] md:h-full">
                            <div id="map-container"></div>
                        </div>
                    </div>
                </div>
                `;
            },

            initMap() {
                // Initialize Leaflet Map
                leafletMap = L.map('map-container').setView([20, 0], 2);

                L.maplibreGL({
                    style: 'https://tiles.openfreemap.org/styles/positron',
                    attribution: '<a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> ' +
                        '&copy; <a href="https://www.openmaptiles.org/" target="_blank" rel="noopener">OpenMapTiles</a> ' +
                        'Data from <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'
                }).addTo(leafletMap);

                // Add markers for all Governor locations
                if (window.EnochianWorld && window.EnochianWorld.entries) {
                    window.EnochianWorld.entries.forEach(entry => {
                        if (entry.sites && entry.sites.length > 0) {
                            entry.sites.forEach(site => {
                                const [lat, lon, radius] = site;
                                const marker = L.circleMarker([lat, lon], {
                                    color: '#D4AF37',
                                    fillColor: '#2A6F97',
                                    fillOpacity: 0.5,
                                    radius: 6,
                                    weight: 1
                                }).addTo(leafletMap);

                                marker.bindPopup(`
                                    <div class="font-serif">
                                        <h4 class="text-solarGold tracking-widest uppercase border-b border-solarGold/20 mb-1 pb-1">${entry.governor}</h4>
                                        <p class="text-xs text-gray-300">${entry.place}</p>
                                        <p class="text-[10px] text-gray-400 mt-1">Aethyr: ${entry.aethyr}</p>
                                    </div>
                                `);

                                mapMarkers.push({
                                    entry: entry,
                                    marker: marker,
                                    lat: lat,
                                    lon: lon,
                                    radius: radius
                                });
                            });
                        }
                    });
                }

                // Autocomplete setup
                const cityInput = document.getElementById('city-input');
                const dropdown = document.getElementById('autocomplete-results');
                let timeout = null;

                cityInput.addEventListener('input', function () {
                    clearTimeout(timeout);
                    const query = this.value.trim();

                    if (query.length < 3) {
                        dropdown.classList.add('hidden');
                        return;
                    }

                    timeout = setTimeout(async () => {
                        try {
                            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5`);
                            const data = await res.json();

                            if (data.length > 0) {
                                dropdown.innerHTML = data.map(item => `
                                    <div class="autocomplete-item" 
                                         onclick="App.selectLocation(${item.lat}, ${item.lon}, '${item.display_name.replace(/'/g, "\\'")}')">
                                        ${item.display_name}
                                    </div>
                                `).join('');
                                dropdown.classList.remove('hidden');
                            } else {
                                dropdown.classList.add('hidden');
                            }
                        } catch (e) {
                            console.error("Autocomplete error:", e);
                        }
                    }, 500);
                });

                // Hide dropdown when clicking outside
                document.addEventListener('click', function (e) {
                    if (e.target !== cityInput && e.target !== dropdown) {
                        dropdown.classList.add('hidden');
                    }
                });

                // Allow enter key submission
                cityInput.addEventListener('keypress', function (e) {
                    if (e.key === 'Enter') {
                        dropdown.classList.add('hidden');
                        App.findNearestEnochianFromInput();
                    }
                });
            },

            selectLocation(lat, lon, displayName) {
                document.getElementById('city-input').value = displayName;
                document.getElementById('autocomplete-results').classList.add('hidden');
                this.processLocation(lat, lon, displayName);
            },

            async findNearestEnochianFromInput() {
                const city = document.getElementById('city-input').value.trim();
                const loadingDiv = document.getElementById('map-loading');
                const resultsDiv = document.getElementById('map-results');

                if (!city) return;

                if (!window.EnochianWorld) {
                    resultsDiv.innerHTML = '<div class="flex items-center justify-center text-red-400 font-serif text-sm tracking-widest uppercase">Error: enochian-worldmap.js not loaded.</div>';
                    return;
                }

                loadingDiv.classList.remove('hidden');
                resultsDiv.innerHTML = '';
                audioEngine.playClick();

                try {
                    const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(city)}`);
                    const data = await response.json();

                    if (data.length === 0) {
                        resultsDiv.innerHTML = `<div class="flex flex-col items-center justify-center text-gray-500 font-serif text-sm tracking-widest uppercase p-4"><span class="text-2xl mb-2">∅</span> Coordinates not found.</div>`;
                        loadingDiv.classList.add('hidden');
                        return;
                    }

                    this.processLocation(parseFloat(data[0].lat), parseFloat(data[0].lon), data[0].display_name);
                } catch (err) {
                    resultsDiv.innerHTML = `<div class="flex items-center justify-center text-red-400 font-serif text-sm tracking-widest uppercase p-4">Connection error.</div>`;
                    loadingDiv.classList.add('hidden');
                }
            },

            processLocation(userLat, userLon, userDisplay) {
                const loadingDiv = document.getElementById('map-loading');
                const resultsDiv = document.getElementById('map-results');

                if (loadingDiv) loadingDiv.classList.add('hidden');
                audioEngine.playClick();

                // Zoom map to the location
                if (leafletMap) {
                    // Fly to the new location
                    leafletMap.flyTo([userLat, userLon], 5, { duration: 1.5 });

                    // Add a temporary marker for the user's searched city
                    const userIcon = L.divIcon({
                        className: 'custom-user-marker',
                        html: `<svg class="w-6 h-6 stroke-enochianCrimson fill-none animate-pulse-slow" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 21s-8-4.5-8-11.8A8 8 0 0112 2a8 8 0 018 7.2c0 7.3-8 11.8-8 11.8z" />
                                <circle cx="12" cy="9.2" r="2.5" stroke-width="2"/>
                               </svg>`,
                        iconSize: [24, 24],
                        iconAnchor: [12, 24]
                    });

                    // Remove previous user marker if it exists
                    if (this.userMarker) {
                        leafletMap.removeLayer(this.userMarker);
                    }

                    this.userMarker = L.marker([userLat, userLon], { icon: userIcon })
                        .addTo(leafletMap)
                        .bindPopup(`<div class="font-serif text-xs">Origin: ${userDisplay.split(',')[0]}</div>`)
                        .openPopup();
                }

                const getDist = (lat1, lon1, lat2, lon2) => {
                    const R = 6371;
                    const dLat = (lat2 - lat1) * Math.PI / 180;
                    const dLon = (lon2 - lon1) * Math.PI / 180;
                    const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
                    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
                };

                let nearest = null;
                let minDistance = Infinity;
                let targetMarker = null;

                window.EnochianWorld.entries.forEach(entry => {
                    if (entry.sites && entry.sites.length > 0) {
                        entry.sites.forEach(site => {
                            const [siteLat, siteLon, radius] = site;
                            const rawDist = getDist(userLat, userLon, siteLat, siteLon);
                            const effDist = Math.max(0, rawDist - radius);
                            if (effDist < minDistance) {
                                minDistance = effDist;
                                nearest = { entry, distance: Math.round(rawDist), effDist: Math.round(effDist) };

                                // Find corresponding map marker
                                targetMarker = mapMarkers.find(m =>
                                    m.lat === siteLat && m.lon === siteLon && m.entry.governor === entry.governor
                                );
                            }
                        });
                    }
                });

                if (nearest) {
                    const e = nearest.entry;
                    const aethyrInfo = window.EnochianWorld.aethyrs.find(a => a.name === e.aethyr) || { total: 'Unknown' };

                    // Highlight the target marker
                    if (targetMarker && targetMarker.marker) {
                        setTimeout(() => {
                            targetMarker.marker.openPopup();
                            // Optional: draw a line from user to target
                            if (this.connectionLine) leafletMap.removeLayer(this.connectionLine);
                            this.connectionLine = L.polyline([
                                [userLat, userLon],
                                [targetMarker.lat, targetMarker.lon]
                            ], {
                                color: '#C93B2B',
                                weight: 2,
                                opacity: 0.6,
                                dashArray: '5, 10'
                            }).addTo(leafletMap);
                        }, 1600); // wait for flyTo to mostly finish
                    }

                    resultsDiv.innerHTML = `
                    <div class="animate-fade-in flex flex-col gap-4">
                        <div class="bg-black/30 p-4 rounded border border-white/5">
                            <h3 class="text-[10px] uppercase tracking-[0.2em] text-gray-500 mb-1">Geospatial Target</h3>
                            <p class="font-serif text-gray-300 text-xs truncate" title="${userDisplay}">${userDisplay.split(',')[0]} <span class="text-[9px] text-aethyrSapphire tracking-widest ml-2">${userLat.toFixed(2)}°, ${userLon.toFixed(2)}°</span></p>
                        </div>
                        
                        <div class="bg-black/20 p-4 rounded-lg border border-solarGold/30">
                            <h3 class="text-[10px] uppercase tracking-[0.2em] text-solarGold mb-3 border-b border-solarGold/20 pb-1">Primary Resonating Governor</h3>
                            
                            <div class="flex justify-between items-end mb-4">
                                <div>
                                    <div class="text-[9px] text-gray-500 uppercase tracking-widest mb-1">Governor</div>
                                    <div class="font-serif text-2xl text-solarGold tracking-widest glow-gold">${e.governor}</div>
                                </div>
                                <div class="text-right">
                                    <div class="text-[9px] text-gray-500 uppercase tracking-widest mb-1">Aethyr</div>
                                    <div class="font-serif text-xl text-solarGold tracking-widest">${e.order}. ${e.aethyr}</div>
                                </div>
                            </div>
                            
                            <div class="grid grid-cols-2 gap-3 text-xs">
                                <div>
                                    <div class="text-[9px] text-gray-500 uppercase tracking-widest mb-1">Location</div>
                                    <div class="font-serif text-gray-200 tracking-wider truncate">${e.place}</div>
                                </div>
                                <div>
                                    <div class="text-[9px] text-gray-500 uppercase tracking-widest mb-1">Proximity</div>
                                    <div class="font-serif text-aethyrSapphire">${nearest.distance} km</div>
                                </div>
                            </div>
                        </div>
                        
                        <div>
                            <h3 class="text-[10px] uppercase tracking-[0.2em] text-gray-500 mb-2 border-b border-gray-800 pb-1">Command Matrix</h3>
                            <ul class="space-y-1.5 font-serif text-xs">
                                <li class="flex justify-between items-center bg-black/40 px-3 py-2 border border-white/5 rounded">
                                    <span class="text-[9px] text-gray-400 uppercase tracking-widest">Ruling Angel</span> 
                                    <span class="text-gray-200">${e.angel} (No. ${e.angelNo})</span>
                                </li>
                                <li class="flex justify-between items-center bg-black/40 px-3 py-2 border border-white/5 rounded">
                                    <span class="text-[9px] text-gray-400 uppercase tracking-widest">Quarter</span> 
                                    <span class="text-gray-200">${e.tribe} / ${e.quarter || e.direction}</span>
                                </li>
                                <li class="flex justify-between items-center bg-black/40 px-3 py-2 border border-white/5 rounded">
                                    <span class="text-[9px] text-gray-400 uppercase tracking-widest">Good Ministers</span> 
                                    <span class="text-gray-200">${e.ministers}</span>
                                </li>
                            </ul>
                        </div>
                    </div>
                    `;
                }
            },
            // ---------- End World Map Module ----------

            subTabs(key, options) {
                return `<div class="flex flex-wrap gap-2">` + options.map(o => `
                <button onclick="App.set('${key}', '${o.id}')" class="px-4 py-2 rounded-full border text-xs font-serif tracking-widest uppercase transition-all ${this.state[key] === o.id ? 'border-solarGold text-solarGold bg-solarGold/10' : 'border-white/10 text-gray-400 hover:text-solarGold hover:border-solarGold/40'}">${o.label}</button>`).join('') + `</div>`;
            },

            scriptToggle() {
                const on = this.state.useEnochianFont;
                return `
                <button onclick="App.toggleScript()" class="flex items-center gap-3 outline-none" title="Switch between alphabet and Enochian script">
                    <span class="text-[10px] uppercase tracking-widest font-serif ${on ? 'text-gray-500' : 'text-solarGold'}">Alphabet</span>
                    <span class="w-10 h-5 rounded-full relative border bg-obsidian ${on ? 'border-solarGold' : 'border-gray-600'}">
                        <span class="absolute top-0.5 left-0.5 w-4 h-4 rounded-full transition-transform ${on ? 'translate-x-5 bg-solarGold' : 'bg-gray-500'}"></span>
                    </span>
                    <span class="text-[10px] uppercase tracking-widest font-serif ${on ? 'text-solarGold' : 'text-gray-500'}">Enochian</span>
                </button>`;
            },

            imageFrame(src, alt) {
                return `
                <div class="relative w-full mx-auto rounded-lg overflow-hidden border border-solarGold/20 bg-black/40" style="aspect-ratio: 1 / 1; max-width: 520px;">
                    <img src="${src}" alt="${alt}" class="absolute inset-0 w-full h-full object-contain" onerror="App.imgMissing(this)">
                    <div class="absolute inset-0 flex-col items-center justify-center text-center p-6 gap-2" style="display:none;">
                        <svg class="w-10 h-10 stroke-gray-600 fill-none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4-4 4 4 4-6 4 6M4 4h16v16H4z"/></svg>
                        <span class="text-[10px] uppercase tracking-widest text-gray-500 font-serif">Image not found</span>
                        <code class="text-xs text-solarGold">${src}</code>
                    </div>
                </div>`;
            },

            imgMissing(img) {
                img.style.display = 'none';
                const note = img.nextElementSibling;
                if (note) note.style.display = 'flex';
            },

            missingData(file) {
                return `<div class="max-w-xl mx-auto mt-16 text-center font-serif text-gray-400">Could not load <code class="text-solarGold">${file}</code>. Make sure it sits in the same folder as this HTML file.</div>`;
            },

            viewTable() {
                if (!tablesData) return this.missingData('enochian-tables.js');

            lamenSVG() {
                const L = tablesData.lamen;
                const enoch = this.state.useEnochianFont;
                const fontFamily = enoch ? "'Enochian', sans-serif" : "'Inter', sans-serif";
                const size = enoch ? 30 : 22;
                const weight = enoch ? 400 : 400;
                const letter = (x, y, ch) => `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central">${enoch ? ch.toLowerCase() : ch}</text>`;
                const cx = col => L.ox + L.u * col;
                const cy = row => L.oy + L.u * row;
                const side = L.u * 8;
                const adv = 17;

                let cells = '', letters = '';
                L.gridRows.forEach(r => {
                    [...r.letters].forEach((ch, i) => {
                        const col = r.col + i;
                        cells += `<rect x="${cx(col)}" y="${cy(r.row)}" width="${L.u}" height="${L.u}"/>`;
                        letters += letter(cx(col + 0.5), cy(r.row + 0.5), ch);
                    });
                });
                L.points.forEach(p => { letters += letter(cx(p.col), cy(p.row), p.ch); });

                L.labels.forEach(lb => {
                    const offsets = [];
                    let pos = 0;
                    [...lb.t].forEach(ch => { if (ch === ' ') { pos += 9; } else { offsets.push([ch, pos]); pos += adv; } });
                    const width = offsets[offsets.length - 1][1];
                    const start = lb.a === 'start' ? lb.x + 8 : lb.a === 'end' ? lb.x - 8 - width : lb.x - width / 2;
                    offsets.forEach(([ch, off]) => { letters += letter(start + off, lb.y, ch); });
                });

                const top = [cx(4), cy(0)], right = [cx(8), cy(4)], bottom = [cx(4), cy(8)], left = [cx(0), cy(4)];
                return `
                <svg viewBox="0 0 ${L.w} ${L.h}" class="w-full h-auto mx-auto" style="max-width: 560px; display:block;" role="img" aria-label="Heptarchic Lamen">
                    <g fill="none" stroke="#D4AF37" stroke-opacity="0.55" stroke-width="1">
                        <rect x="1" y="1" width="${L.w - 2}" height="${L.h - 2}"/>
                        <rect x="${L.ox}" y="${L.oy}" width="${side}" height="${side}"/>
                        <polygon points="${top} ${right} ${bottom} ${left}"/>
                    </g>
                    <g fill="none" stroke="#D4AF37" stroke-opacity="0.45" stroke-width="1">${cells}</g>
                    <g fill="#F1E6B8" font-family="${fontFamily}" font-size="${size}" font-weight="${weight}">${letters}</g>
                </svg>`;
            },
